<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>API Sandbox (Swagger UI)</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5.33.0/swagger-ui.css" />
    <style>
      body { margin: 0; background: #fafafa; }
      .sandbox-note { margin: 0; padding: 10px 16px; font: 14px/1.5 system-ui, sans-serif; background: #1f2937; color: #f9fafb; }
      .sandbox-note a, .sandbox-note code { color: #93c5fd; }
    </style>
  </head>
  <body>
    <p class="sandbox-note">
      Interactive sandbox. For "Try it out", start the mock with
      <code>npx @stoplight/prism-cli mock docs/openapi/openapi.yaml</code>, pick the
      <code>http://127.0.0.1:4010</code> server, and authorize with any bearer token.
      Reading the docs? Use the <a href="../">Redoc reference</a>.
    </p>
    <div id="swagger-ui"></div>
    <script src="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5.33.0/swagger-ui-bundle.js"></script>
    <script>
      window.ui = SwaggerUIBundle({
        url: "../openapi.yaml",
        dom_id: "#swagger-ui",
        deepLinking: true,
        filter: true,
        tryItOutEnabled: true,
        persistAuthorization: true,
        displayRequestDuration: true,
        showExtensions: true,
      });
    </script>
  </body>
</html>
