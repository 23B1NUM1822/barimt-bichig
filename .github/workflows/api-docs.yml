name: API docs

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

env:
  REDOCLY_CLI: "@redocly/cli@2.56.0"
  PRISM_CLI: "@stoplight/prism-cli@5.16.0"

jobs:
  verify:
    name: Lint spec & run code samples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Lint OpenAPI spec (redocly.yaml rules)
        run: npx --yes "$REDOCLY_CLI" lint docs/openapi/openapi.yaml --format github-actions

      - name: Start Prism mock server
        run: |
          npx --yes "$PRISM_CLI" mock -h 127.0.0.1 -p 4010 docs/openapi/openapi.yaml > prism.log 2>&1 &
          curl --silent --fail --retry 60 --retry-connrefused --retry-delay 2 --output /dev/null \
            -H "Authorization: Bearer your_student_jwt_from_login" http://127.0.0.1:4010/api/v1/categories

      - name: Run code samples and compare with the documented responses
        run: |
          pip install requests==2.32.5
          python scripts/verify_code_samples.py

      # Spec rules, the lint gate, every documented example served by the mock, and the
      # expected failure on the old unversioned path (lecture W05, milestone M5).
      - name: Contract tests
        run: python -m unittest discover -s scripts -v

      - name: Show Prism log
        if: failure()
        run: cat prism.log

  code-docs:
    name: Check docstrings & build TypeDoc (zero warnings)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lab06
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: lab06/package-lock.json

      - run: npm ci
      - name: Type-check the documented source
        run: npm run typecheck
      - name: Every TODO/FIXME links to an issue
        run: npm run check:todos
      - name: Compile every @example in the docstrings
        run: npm run check:examples
      - name: Hallucination test (reflection)
        run: npm run test:hallucinations
      # typedoc.json sets treatWarningsAsErrors, the TypeDoc equivalent of `sphinx-build -W`.
      - name: Build the API reference with TypeDoc
        run: npm run docs

      - uses: actions/upload-artifact@v7
        with:
          name: typedoc
          path: public/api

  build:
    name: Build Redoc & Swagger UI
    needs: [verify, code-docs]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The api-v* tags are needed to build one pinned site per released version.
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Build Redoc (site root) and publish the raw spec next to Swagger UI
        run: |
          npx --yes "$REDOCLY_CLI" build-docs docs/openapi/openapi.yaml -o public/index.html
          cp docs/openapi/openapi.yaml docs/openapi/openapi.json public/
          version=$(jq -r .info.version docs/openapi/openapi.json)
          spec_hash=$(sha256sum docs/openapi/openapi.yaml | cut -c1-12)
          jq -n --arg version "$version" --arg specSha256 "$spec_hash" --arg commit "$GITHUB_SHA" \
            '{version: $version, specSha256: $specSha256, commit: $commit}' > public/spec-version.json

      - name: Build one pinned copy per released version (tags api-v*)
        run: |
          for tag in $(git tag --list 'api-v*'); do
            version="${tag#api-}"
            mkdir -p "public/$version/swagger"
            git show "$tag:docs/openapi/openapi.yaml" > "public/$version/openapi.yaml"
            npx --yes "$REDOCLY_CLI" build-docs "public/$version/openapi.yaml" -o "public/$version/index.html"
            cp public/swagger/index.html "public/$version/swagger/index.html"
          done

      - name: Add the TypeDoc reference at /api/
        uses: actions/download-artifact@v8
        with:
          name: typedoc
          path: public/api

      - uses: actions/upload-pages-artifact@v5
        with:
          path: public

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

      # Publish gate: the URL must answer with the version that was just built, never a stale one.
      - name: The live site serves this commit
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          for attempt in $(seq 1 18); do
            live=$(curl --silent --fail "${PAGE_URL}spec-version.json?run=$GITHUB_RUN_ID-$attempt" | jq -r .commit || true)
            if [ "$live" = "$GITHUB_SHA" ]; then echo "Live site is at $GITHUB_SHA"; exit 0; fi
            sleep 10
          done
          echo "::error::The live site serves commit '$live', expected $GITHUB_SHA"
          exit 1
